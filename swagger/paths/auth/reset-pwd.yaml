tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: |
  Resets user password using a JWT token from the email.
  All user sessions will be invalidated after reset.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../docs/openapi.yaml#/components/schemas/UserResetPassword'
responses:
  '200':
    description: Password has been successfully reset
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Password has been successfully reset."
            data:
              type: object
              example: {}
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '401':
    description: Token is expired or invalid
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '404':
    description: User not found
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'

