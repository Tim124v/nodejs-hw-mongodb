tags:
  - Auth
summary: User registration
operationId: registerUser
description: |
  Registers a new user account.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../../docs/openapi.yaml#/components/schemas/UserRegister'
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/AuthResponse'
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '409':
    description: User with this email already exists
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
