tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: |
  Creates a new contact for the authenticated user.
  Supports image upload via multipart/form-data.
  Requires user authentication.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 2
            maxLength: 50
            description: Contact name
            example: "John Doe"
          email:
            type: string
            format: email
            description: Contact email
            example: "john@example.com"
          phone:
            type: string
            description: Contact phone
            example: "+380501234567"
          favorite:
            type: boolean
            description: Favorite contact
            default: false
            example: false
          photo:
            type: string
            format: binary
            description: Contact photo (PNG, JPG, up to 5MB)
        required:
          - name
          - email
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Contact created successfully"
            data:
              $ref: '../../../docs/openapi.yaml#/components/schemas/Contact'
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '500':
    description: Image upload error
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'

