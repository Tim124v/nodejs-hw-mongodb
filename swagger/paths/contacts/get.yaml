tags:
  - Contacts
summary: Get contacts list
operationId: getContacts
description: |
  Returns user's contacts with pagination and filtering.
  Requires user authentication.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number (starting from 1)
    schema:
      type: integer
      minimum: 1
      default: 1
    example: 1
  - name: perPage
    in: query
    required: false
    description: Items per page
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    example: 10
  - name: sortBy
    in: query
    required: false
    description: Field to sort by
    schema:
      type: string
      enum: [name, email, phoneNumber, createdAt]
      default: name
    example: name
  - name: sortOrder
    in: query
    required: false
    description: Sort order
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    example: asc
  - name: isFavourite
    in: query
    required: false
    description: Filter by favourite flag
    schema:
      type: boolean
    example: true
  - name: contactType
    in: query
    required: false
    description: Filter by contact type
    schema:
      type: string
      enum: [work, home, personal]
    example: work
responses:
  '200':
    description: Contacts list retrieved successfully
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/ContactList'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '400':
    description: Invalid query parameters
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'

