tags:
  - Contacts
summary: Get contacts list
operationId: getContacts
description: |
  Returns user's contacts with pagination and filtering.
  Requires user authentication.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number (starting from 1)
    schema:
      type: integer
      minimum: 1
      default: 1
    example: 1
  - name: limit
    in: query
    required: false
    description: Items per page
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    example: 10
  - name: favorite
    in: query
    required: false
    description: Filter by favorite contacts
    schema:
      type: boolean
    example: true
responses:
  '200':
    description: Contacts list retrieved successfully
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/ContactList'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'
  '400':
    description: Invalid query parameters
    content:
      application/json:
        schema:
          $ref: '../../../docs/openapi.yaml#/components/schemas/Error'

